<div>
  <h2 class="mb-4">Transactions (RevenueCat)</h2>
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th scope="col">Event ID</th>
              <th scope="col">Type</th>
              <th scope="col">User App ID</th>
              <th scope="col">Product ID</th>
              <th scope="col">Price</th>
              <th scope="col">Date</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let event of events$ | async">
              <td>{{ event.id }}</td>
              <td><span class="badge bg-info text-dark">{{ event.type }}</span></td>
              <td>{{ event.app_user_id }}</td>
              <td>{{ event.product_id || '-' }}</td>
              <td>{{ event.price || '-' }} {{ event.currency || '' }}</td>
              <td>{{ event.event_timestamp_ms | date:'medium' }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
