<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, rgba(139, 92, 246, 0.15), transparent 60%), var(--bg-base);">
  <div class="glass-card flex-col items-center justify-center" style="width: 100%; max-width: 420px; padding: 3rem 2rem; text-align: center; position: relative; overflow: hidden;">
    <div style="position: absolute; top: -50px; left: -50px; width: 150px; height: 150px; background: var(--accent-primary); filter: blur(60px); opacity: 0.2; border-radius: 50%;"></div>
    
    <div class="sidebar-logo-icon" style="width: 64px; height: 64px; border-radius: 16px; margin-bottom: 1.5rem; background: transparent; padding: 0;">
      <img src="favicon.png" alt="Swara" style="width: 100%; height: 100%; object-fit: contain; border-radius: 16px;">
    </div>
    
    <h3 class="title-md mb-2">Swara Admin</h3>
    <p class="text-secondary mb-6">Sign in to manage your platform</p>
    
    <button class="btn btn-primary w-full flex items-center justify-center gap-2" (click)="login()" style="padding: 0.875rem;">
      <i class="bi bi-google"></i>
      Sign in with Google
    </button>
  </div>
</div>
